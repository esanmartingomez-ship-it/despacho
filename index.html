<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- =====================================================================
     APP INSTALABLE DE LA COFRADÍA
     Solo hay que cambiar la línea de APP_URL (más abajo) por la URL de la
     aplicación web de Google (la que termina en /exec).
     El nombre y el color se cambian también en manifest.webmanifest.
     ===================================================================== -->
<title>Despacho de pesca</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E6782">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Despacho">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #2E6782; overflow: hidden; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #f4f6f8;
         padding-top: env(safe-area-inset-top); box-sizing: border-box; }
  #carga { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
           gap: 18px; color: #fff; font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; text-align: center; padding: 24px; }
  #carga img { width: 112px; height: 112px; border-radius: 24px; }
  #carga .rueda { width: 34px; height: 34px; border: 4px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; animation: g .8s linear infinite; }
  @keyframes g { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="carga"><img src="icon-512.png" alt=""><div class="rueda"></div><div id="msg">Cargando…</div></div>
<iframe id="app" title="Despacho de pesca" allow="clipboard-write" style="visibility:hidden"></iframe>
<script>
  // ↓↓↓ PEGA AQUÍ LA URL DE TU APLICACIÓN WEB DE GOOGLE (termina en /exec) ↓↓↓
  var APP_URL = 'https://script.google.com/macros/s/AKfycbz-QIeeGlX3uo6HaffkdbQdkgnEhwkbZPMhTzlhyXBP-_rtOgfxpZH6M2B53bojbJM/exec';
  // ↑↑↑ ----------------------------------------------------------------- ↑↑↑

  var marco = document.getElementById('app');
  var msg = document.getElementById('msg');
  if (!/^https:\/\/script\.google\.com\//.test(APP_URL)) {
    msg.textContent = 'Falta configurar la dirección de la app en index.html (APP_URL).';
    document.querySelector('.rueda').style.display = 'none';
  } else if (!navigator.onLine) {
    msg.textContent = 'Sin conexión a internet. La app necesita conexión para funcionar.';
    document.querySelector('.rueda').style.display = 'none';
  } else {
    marco.onload = function () {
      marco.style.visibility = 'visible';
      document.getElementById('carga').style.display = 'none';
    };
    marco.src = APP_URL;
  }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
